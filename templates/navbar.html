<!-- Navbar -->
<nav>
    <i class='bx bx-menu'></i>
    <form action="#">
        <div class="form-input">
            <input type="search" placeholder="Search...">
            <button class="search-btn" type="submit"><i class='bx bx-search'></i></button>
        </div>
    </form>
    <div class="navbar">
        <span id="mode" style="display: none;">system</span>
        <!--<button id="theme-toggle">Change mode</button>-->
        
        <div class="dark-mode" id="theme-toggle">
            <span class="material-icons-sharp active">
                light_mode
            </span>
            <span class="material-icons-sharp">
                dark_mode
            </span>
        </div>
        
        {%if (current_user.last_name == None) and (current_user.first_name == None)%}

        {%else%}
        <div class="profile">
            <div class="info">
                <p>Hey, <b>{{current_user.first_name}}</b></p>
                <small class="text-muted">{{current_user.account_type}}</small>
            </div>
            <div class="profile-photo">
                <img src="{{url_for('static', filename= '/images/Dp.jpg')}}">
            </div>
        </div>
        {%endif%}
    <div>
</nav>
<!-- End of Navbar -->
